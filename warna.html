<!DOCTYPE html>
<html>
<head>
    <title>Tabel Biru Hijau</title>
</head>

<body>

<table border="1" bordercolor="white" cellspacing="0" cellpadding="0"
       width="600" height="780">

    <!-- BARIS 1 -->
    <tr height="110">

        <!-- BIRU KIRI PANJANG -->
        <td bgcolor="blue" rowspan="6" width="110"></td>

        <!-- BIRU ATAS -->
        <td bgcolor="blue" colspan="2" width="330"></td>

        <!-- KOSONG -->
        <td width="130"></td>

    </tr>


    <!-- BARIS 2 -->
    <tr height="110">

        <!-- HIJAU KIRI -->
        <td bgcolor="lime" width="165"></td>

        <!-- HIJAU BESAR -->
        <td bgcolor="lime" rowspan="2" width="165"></td>

        <!-- BIRU KANAN -->
        <td bgcolor="blue" rowspan="2" width="130"></td>

    </tr>


    <!-- BARIS 3 -->
    <tr height="110">

        <!-- KOSONG -->
        <td></td>

    </tr>


    <!-- BARIS 4 -->
    <tr height="110">

        <!-- BIRU BAWAH KIRI -->
        <td bgcolor="blue"></td>

        <!-- KOSONG -->
        <td></td>

        <!-- BIRU BAWAH KANAN -->
        <td bgcolor="blue"></td>

    </tr>


    <!-- BARIS 5 -->
    <tr height="170">

        <td></td>
        <td></td>
        <td></td>

    </tr>


    <!-- BARIS 6 -->
    <tr height="170">

        <td></td>
        <td></td>
        <td></td>

    </tr>

</table>

</body>
</html>
